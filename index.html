<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brody.io</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="background-grid"></div>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <main class="shell">
    <section id="login-view" class="login-view">
      <div class="login-panel">
        <div class="eyebrow">BRODY.IO</div>
        <h1>Interactive paper-trading simulator</h1>
        <p>Shared prices. Live rankings. One synchronized market across every screen.</p>
        <form id="login-form" class="login-form">
          <label>
            Username
            <input id="username" name="username" type="text" placeholder="e.g. Brody" autocomplete="username" required>
          </label>
          <label>
            Password
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <button type="submit" class="primary-btn">Enter Market</button>
        </form>
        <p id="login-error" class="error-text hidden"></p>
      </div>
    </section>

    <section id="app-view" class="app-view hidden">
      <header class="topbar">
        <div>
          <div class="eyebrow">BRODY.IO</div>
          <h2>Paper-Trading Simulator</h2>
        </div>
        <div class="topbar-right">
          <div id="market-status" class="status-pill">Syncing...</div>
          <div class="user-chip">
            <span id="current-user">guest</span>
            <button id="logout-btn" class="ghost-btn">Logout</button>
          </div>
        </div>
      </header>

      <div id="announcement-banner" class="announcement-banner hidden"></div>

      <div id="ticker-tape" class="ticker-tape"></div>

      <div class="layout">
        <aside class="sidebar">
          <button class="nav-link active" data-view="dashboard">Dashboard</button>
          <button class="nav-link" data-view="markets">Markets</button>
          <button class="nav-link" data-view="portfolio">Portfolio</button>
          <button class="nav-link" data-view="trade">Trade</button>
          <button class="nav-link" data-view="leaderboard">Leaderboard</button>
          <button class="nav-link" data-view="history">Trade History</button>
          <button id="admin-link" class="nav-link hidden" data-view="admin">Admin</button>
          <div class="sidebar-note">
            <span class="mono">Backend</span>
            <strong id="connection-state">Connecting</strong>
          </div>
        </aside>

        <section class="content">
          <div id="dashboard-view" class="page-view"></div>
          <div id="markets-view" class="page-view hidden"></div>
          <div id="portfolio-view" class="page-view hidden"></div>
          <div id="trade-view" class="page-view hidden"></div>
          <div id="leaderboard-view" class="page-view hidden"></div>
          <div id="history-view" class="page-view hidden"></div>
          <div id="admin-view" class="page-view hidden"></div>
        </section>
      </div>
    </section>
  </main>

  <script src="./supabase-config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
